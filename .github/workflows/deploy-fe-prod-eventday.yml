name: Deploy Eventday Frontend

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # --- INI LANGKAH INJEKSI ON-THE-FLY ---
      - name: Generate Production .env File
        run: |
          echo "VITE_NGROK_URL=${{ secrets.VITE_NGROK_URL }}" > .env
          echo "Berhasil menyuntikkan VITE_NGROK_URL ke lingkungan production build!"

      - name: Build Vite Production
        run: npm run build

      - name: Deploy dist/ folder to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "dist/*"
          target: "/var/www/eventday-fe/"
          strip_components: 1